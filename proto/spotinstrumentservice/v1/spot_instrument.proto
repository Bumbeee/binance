syntax = "proto3";

// Package spotinstrumentservice.v1 defines the public gRPC contract for
// SpotInstrumentService: the catalog of tradable spot pairs and their
// current rates.
package spotinstrumentservice.v1;

option go_package = "spotinstrumentservice/v1;spotinstrumentv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// SpotInstrumentService manages the catalog of tradable instruments (spot
// pairs) and their current exchange rates.
//
// Read methods (GetInstrument, ListInstruments) are public and require no
// authentication. Write methods (CreateInstrument, ArchiveInstrument,
// UpdateRate) require the caller to hold ROLE_ADMIN, verified against
// UserService.ValidateToken since this service does not issue or own
// tokens itself.
service SpotInstrumentService {
  // CreateInstrument registers a new tradable pair. The instrument starts
  // in INSTRUMENT_STATUS_ACTIVE with an initial rate of "0" until the first
  // UpdateRate call. Requires ROLE_ADMIN.
  rpc CreateInstrument (CreateInstrumentRequest) returns (CreateInstrumentResponse) {}

  // GetInstrument returns a single instrument by ID. Public, no auth
  // required.
  rpc GetInstrument (GetInstrumentRequest) returns (GetInstrumentResponse) {}

  // ListInstruments returns all instruments, optionally filtered by status.
  // Public, no auth required. Not paginated.
  rpc ListInstruments (ListInstrumentsRequest) returns (ListInstrumentsResponse) {}

  // ArchiveInstrument moves an instrument to INSTRUMENT_STATUS_DELISTED.
  // This is a soft delete: the row is preserved for referential integrity
  // with existing orders. Requires ROLE_ADMIN.
  rpc ArchiveInstrument (ArchiveInstrumentRequest) returns (ArchiveInstrumentResponse) {}

  // UpdateRate sets the current exchange rate for an instrument. Expected
  // to be called frequently, potentially by an automated rate-feed actor
  // rather than a human. Requires ROLE_ADMIN.
  rpc UpdateRate (UpdateRateRequest) returns (UpdateRateResponse) {}
}

// InstrumentStatus reflects whether an instrument is currently tradable.
enum InstrumentStatus {
  // INSTRUMENT_STATUS_UNSPECIFIED is the zero value and should never be
  // assigned to a real instrument.
  INSTRUMENT_STATUS_UNSPECIFIED = 0;
  // INSTRUMENT_STATUS_ACTIVE instruments accept new orders.
  INSTRUMENT_STATUS_ACTIVE = 1;
  // INSTRUMENT_STATUS_PAUSED instruments are temporarily halted; existing
  // orders are unaffected but new orders should be rejected by OrderService.
  INSTRUMENT_STATUS_PAUSED = 2;
  // INSTRUMENT_STATUS_DELISTED instruments are permanently retired via
  // ArchiveInstrument and no longer accept new orders.
  INSTRUMENT_STATUS_DELISTED = 3;
}

// Instrument represents a single tradable spot pair, e.g. BTCUSDT.
//
// Monetary fields (min_order_size, current_rate) are represented as decimal
// strings, not double, to avoid floating-point rounding errors on values
// that represent real money.
message Instrument {
  option (buf.validate.message).cel = {
    id: "instrument.updated_not_before_created"
    message: "updated_at must not be earlier than created_at"
    expression: "this.updated_at >= this.created_at"
  };

  string id = 1 [(buf.validate.field).string.uuid = true];
  // symbol is the combined trading symbol, e.g. "BTCUSDT".
  string symbol = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 16,
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$"
  ];
  // base_asset is the asset being bought/sold, e.g. "BTC".
  string base_asset = 3 [(buf.validate.field).string.pattern = "^[A-Z0-9]{1,16}$"];
  // quote_asset is the asset used to price base_asset, e.g. "USDT".
  string quote_asset = 4 [(buf.validate.field).string.pattern = "^[A-Z0-9]{1,16}$"];
  // price_precision is the number of decimal digits allowed in order prices
  // for this instrument. At most 18, matching the decimal strings used
  // across the contract.
  int32 price_precision = 5 [(buf.validate.field).int32 = {gte: 0, lte: 18}];
  // quantity_precision is the number of decimal digits allowed in order
  // quantities for this instrument. At most 18.
  int32 quantity_precision = 6 [(buf.validate.field).int32 = {gte: 0, lte: 18}];
  // min_order_size is the minimum tradable quantity, as a positive decimal
  // string.
  string min_order_size = 7 [
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "^[0-9]{1,20}(\\.[0-9]{1,18})?$",
    (buf.validate.field).cel = {
      id: "instrument.min_order_size_positive"
      message: "min_order_size must be greater than zero"
      expression: "!this.matches('^[0.]*$')"
    }
  ];
  
  // current_rate is the latest known exchange rate, as a non-negative
  // decimal string. "0" is valid: it is the initial value before the first
  // rate update.
  string current_rate = 8 [
    (buf.validate.field).string.max_len = 40,
    (buf.validate.field).string.pattern = "^[0-9]{1,20}(\\.[0-9]{1,18})?$"
  ];
  InstrumentStatus status = 9 [(buf.validate.field).enum = {not_in: [0], defined_only: true}];
  google.protobuf.Timestamp created_at = 10 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 11 [(buf.validate.field).required = true];
}

message CreateInstrumentRequest {
  string symbol = 1 [(buf.validate.field).string = {min_len: 1, max_len: 16}];
  string base_asset = 2 [(buf.validate.field).string.min_len = 1];
  string quote_asset = 3 [(buf.validate.field).string.min_len = 1];
  int32 price_precision = 4 [(buf.validate.field).int32.gte = 0];
  int32 quantity_precision = 5 [(buf.validate.field).int32.gte = 0];
  string min_order_size = 6 [(buf.validate.field).string.min_len = 1];
}

message CreateInstrumentResponse {
  Instrument instrument = 1;
}

message GetInstrumentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetInstrumentResponse {
  Instrument instrument = 1;
}

message ListInstrumentsRequest {
  // status_filter restricts the result to instruments with this status.
  // Unset returns instruments of all statuses. If set, it must be a
  // defined, non-UNSPECIFIED status.
  optional InstrumentStatus status_filter = 1 [(buf.validate.field).enum = {not_in: [0], defined_only: true}];
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  // page_token is opaque: pass back next_page_token from a previous response.
  string page_token = 3 [(buf.validate.field).string.max_len = 512];
}

message ListInstrumentsResponse {
  repeated Instrument instruments = 1;
  // next_page_token is empty when there are no more results.
  string next_page_token = 2;
}

message ArchiveInstrumentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ArchiveInstrumentResponse {
  Instrument instrument = 1;
}

message UpdateRateRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // rate is the new exchange rate, as a decimal string, e.g. "43521.87".
  string rate = 2 [(buf.validate.field).string.min_len = 1];
}

message UpdateRateResponse {
  Instrument instrument = 1;
}
