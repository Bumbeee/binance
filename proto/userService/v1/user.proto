syntax = "proto3";
package userservice.v1;

option go_package = "userservice/v1;userv1";

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

service UserService {
  rpc Register (RegisterRequest) returns (RegisterResponse) {}
  rpc Login (LoginRequest) returns (LoginResponse) {}
  rpc Logout (LogoutRequest) returns (LogoutResponse) {}
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse) {}
  rpc GetProfile (GetProfileRequest) returns (GetProfileResponse) {}
  rpc GetUserProfile (GetUserProfileRequest) returns (GetUserProfileResponse) {}
  rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileResponse) {} // TODO: implement
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse) {}
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse) {}
}

// TODO: add first last name for user to store
// TODO: add proto validation
// TODO: add commented documentation

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ADMIN = 2;
  ROLE_PREMIUM = 3;
}

message AuthToken {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message RegisterRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 8];
  string first_name = 3 [(buf.validate.field).string.min_len = 1];
  string last_name = 4 [(buf.validate.field).string.min_len = 1];
}

message RegisterResponse {
  string user_id = 1;
  AuthToken auth_token = 2;
}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}

message LoginResponse {
  string user_id = 1;
  AuthToken auth_token = 2;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message LogoutResponse {}

message GetProfileRequest {}

message GetProfileResponse {
  string user_id = 1;
  string email = 2;
  Role role = 3;
  google.protobuf.Timestamp created_at = 4;
  string first_name = 5;
  string last_name = 6;
}

message GetUserProfileRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetUserProfileResponse {
  string user_id = 1;
  string email = 2;
  Role role = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ChangePasswordRequest {
  string old_password = 1 [(buf.validate.field).string.min_len = 1];
  string new_password = 2 [(buf.validate.field).string.min_len = 8];
}

message ChangePasswordResponse {}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  AuthToken auth_token = 1;
}

message UpdateProfileRequest {
  optional string first_name = 1 [(buf.validate.field).string.min_len = 1];
  optional string last_name = 2 [(buf.validate.field).string.min_len = 1];
}

message UpdateProfileResponse {
  string user_id = 1;
  string email = 2;
  Role role = 3;
  google.protobuf.Timestamp created_at = 4;
  string first_name = 5;
  string last_name = 6;
}

message ValidateTokenRequest {
  string access_token = 1 [(buf.validate.field).string.min_len = 1];
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  Role role = 3;
}