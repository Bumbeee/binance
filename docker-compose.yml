services:
  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userservice
    ports:
      - '5432:5432'
    volumes:
      - pgdata_user:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-spot:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotinstrumentservice
    ports:
      - '5433:5432'
    volumes:
      - pgdata_spot:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres-user:5432/userservice?sslmode=disable
      PG_MIN_CONNECTIONS: '2'
      PG_MAX_CONNECTIONS: '10'
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GRPC_ADDR: ':50051'
    ports:
      - '50051:50051'
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy

  spot-instrument-service:
    build:
      context: .
      dockerfile: spot-instrument-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres-spot:5432/spotinstrumentservice?sslmode=disable
      GRPC_ADDR: ':50052'
      USER_SERVICE_ADDR: 'user-service:50051'
    ports:
      - '50052:50052'
    depends_on:
      postgres-spot:
        condition: service_healthy
      user-service:
        condition: service_started

volumes:
  pgdata_user:
  pgdata_spot:
