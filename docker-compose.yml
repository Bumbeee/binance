services:
  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userservice
    ports:
      - '5432:5432'
    volumes:
      - pgdata_user:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-spot:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotinstrumentservice
    ports:
      - '5433:5432'
    volumes:
      - pgdata_spot:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-order:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderservice
    ports:
      - '5434:5432'
    volumes:
      - pgdata_order:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  tempo:
    image: grafana/tempo:latest
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - '4317:4317'
      - '3200:3200'

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - user-service
      - spot-instrument-service
      - order-service

  loki:
    image: grafana/loki:3.3.2
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'

  alloy:
    image: grafana/alloy:latest
    command:
      ['run', '--storage.path=/var/lib/alloy/data', '/etc/alloy/config.alloy']
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - tempo
      - prometheus
      - loki

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '9094:9094'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic trades.executed \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic trades.executed.dlq \
          --partitions 1 --replication-factor 1 \
          --config retention.ms=1209600000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic trades.executed.dead \
          --partitions 1 --replication-factor 1 \
          --config retention.ms=2592000000
    restart: 'no'

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres-user:5432/userservice?sslmode=disable
      PG_MIN_CONNECTIONS: '2'
      PG_MAX_CONNECTIONS: '10'
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GRPC_ADDR: ':50051'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'tempo:4317'
    ports:
      - '50051:50051'
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started

  spot-instrument-service:
    build:
      context: .
      dockerfile: spot-instrument-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres-spot:5432/spotinstrumentservice?sslmode=disable
      GRPC_ADDR: ':50052'
      USER_SERVICE_ADDR: 'user-service:50051'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'tempo:4317'
      KAFKA_BROKERS: 'kafka:9092'
    ports:
      - '50052:50052'
    depends_on:
      postgres-spot:
        condition: service_healthy
      user-service:
        condition: service_started
      tempo:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres-order:5432/orderservice?sslmode=disable
      GRPC_ADDR: ':50053'
      USER_SERVICE_ADDR: 'user-service:50051'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'tempo:4317'
      KAFKA_BROKERS: 'kafka:9092'
    ports:
      - '50053:50053'
    depends_on:
      postgres-order:
        condition: service_healthy
      user-service:
        condition: service_started
      tempo:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

volumes:
  pgdata_user:
  pgdata_spot:
  pgdata_order:
  tempo_data:
  loki_data:
  kafka_data:
